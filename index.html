<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Center Cost Comparison (with Precision)</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function DataCenterCompare() {
      // Facility size
      const [sizeMW, setSizeMW] = useState(400);

      // Construction costs (per MW)
      const [constructionCostChina, setConstructionCostChina] = useState(6);
      const [constructionCostUS, setConstructionCostUS] = useState(10);

      // PUE (Power Usage Effectiveness) - shared between both countries
      const [pue, setPue] = useState(1.11);

      // Utilization rate
      const [utilization, setUtilization] = useState(60);

      // Arithmetic Intensity for SPFLOPS calculation (adjustable)
      const [arithmeticIntensity, setArithmeticIntensity] = useState(200);

      // Precision levels for each hardware
      const [quantizationGB200, setQuantizationGB200] = useState('FP16');
      const [quantizationCM384, setQuantizationCM384] = useState('FP16');
      const [quantizationH200, setQuantizationH200] = useState('FP16');

      // Hardware price sliders (actual prices, not percentages)
      // GB200 NVL72: ~$2.6M per rack, ±10% range = $2.34M - $2.86M
      const [gb200PricePerUnit, setGb200PricePerUnit] = useState(2600000);
      const gb200PriceLow = 2340000;
      const gb200PriceHigh = 2860000;

      // CM384: ~$8M per rack, ±10% range = $7.2M - $8.8M
      const [cm384PricePerUnit, setCm384PricePerUnit] = useState(8000000);
      const cm384PriceLow = 7200000;
      const cm384PriceHigh = 8800000;

      // H200: DGX price per unit (range $322,500 - $500,000)
      const [h200PricePerUnit, setH200PricePerUnit] = useState(450000);
      const h200PriceLow = 322500;
      const h200PriceHigh = 500000;

      // Electricity rate sliders ($/kWh)
      // US: EIA range $0.0588 (Louisiana) to $0.1903 (Massachusetts), mid ~$0.09
      const [electricityRateUS, setElectricityRateUS] = useState(0.0906);
      const electricityRateUSLow = 0.0588;
      const electricityRateUSHigh = 0.1903;

      // China: CEIC range ~$0.057 to $0.11, mid ~$0.056
      const [electricityRateChina, setElectricityRateChina] = useState(0.05565);
      const electricityRateChinaLow = 0.045;
      const electricityRateChinaHigh = 0.11;

      // Precision multipliers for PFLOPS and effective bandwidth
      // Lower precision = more ops and more values per byte transferred
      const quantizationSpecs = {
        'FP16': { pflopsMultiplier: 1, bandwidthMultiplier: 1, bytesPerValue: 2 },
        'INT8': { pflopsMultiplier: 2, bandwidthMultiplier: 2, bytesPerValue: 1 },
        'FP4':  { pflopsMultiplier: 4, bandwidthMultiplier: 4, bytesPerValue: 0.5 },
      };

      // Base hardware specs (at FP16)
      const baseHardware = {
        gb200: {
          name: "Nvidia GB200 NVL72",
          powerW: 145000,
          costPerUnit: 2600000,
          memBandwidthTBs: 576, // TB/s
          peakPFLOPS: 180,
          supportedQuant: ['FP16', 'INT8', 'FP4'],
        },
        cm384: {
          name: "Huawei CloudMatrix 384",
          powerW: 599821,
          costPerUnit: 8000000,
          memBandwidthTBs: 1229, // TB/s
          peakPFLOPS: 300,
          supportedQuant: ['FP16', 'INT8'],
        },
        h200pod: {
          name: "DGX H200 Pod (9 nodes)",
          powerW: 95220, // 9 x (10,200 + 380) per node
          // Cost calculated dynamically based on h200PricePerUnit slider
          memBandwidthTBs: 345.6, // 9 x 8 x 4.8 TB/s
          peakPFLOPS: 144, // 9 x 8 x 2 PFLOPS
          supportedQuant: ['FP16', 'INT8'],
        }
      };

      // Get effective hardware specs based on quantization
      const getEffectiveHardware = (baseHw, quantization) => {
        const qSpec = quantizationSpecs[quantization];
        return {
          ...baseHw,
          peakPFLOPS: baseHw.peakPFLOPS * qSpec.pflopsMultiplier,
          effectiveBandwidthTBs: baseHw.memBandwidthTBs * qSpec.bandwidthMultiplier,
          quantization: quantization,
        };
      };

      // Get effective hardware for each config
      const hardware = {
        gb200: getEffectiveHardware(baseHardware.gb200, quantizationGB200),
        cm384: getEffectiveHardware(baseHardware.cm384, quantizationCM384),
        h200pod: getEffectiveHardware(baseHardware.h200pod, quantizationH200),
      };

      // Calculate the crossover AI where hardware transitions from memory-bound to compute-bound
      const calcCrossoverAI = (hw) => {
        return Math.round(hw.peakPFLOPS * 1000 / hw.effectiveBandwidthTBs);
      };

      // Check if hardware is compute-bound at current AI
      const isComputeBound = (hw) => {
        return arithmeticIntensity >= calcCrossoverAI(hw);
      };

      // Calculate sustainable PFLOPS
      const calcSPFLOPS = (hw) => {
        const memLimited = hw.effectiveBandwidthTBs * arithmeticIntensity / 1000;
        return Math.min(hw.peakPFLOPS, memLimited);
      };

      // Calculate available energy for GPU hardware (after PUE and 48MW overhead)
      const calculateAvailableEnergy = () => {
        return (sizeMW * 1000000 / pue) - 48000000; // 48MW for CPUs/storage
      };

      // Calculate number of racks (rounded down to whole numbers)
      const availableEnergy = calculateAvailableEnergy();
      const racksUS = Math.floor(availableEnergy / baseHardware.gb200.powerW);
      const racksChina = Math.floor(availableEnergy / baseHardware.cm384.powerW);
      const podsH200 = Math.floor(availableEnergy / baseHardware.h200pod.powerW);

      // Calculate costs
      const constructionTotalChina = sizeMW * constructionCostChina * 1000000;
      const constructionTotalUS = sizeMW * constructionCostUS * 1000000;

      // Hardware costs using slider prices
      const hardwareCostUS = racksUS * gb200PricePerUnit;
      const hardwareCostChina = racksChina * cm384PricePerUnit;
      // H200 cost: (price per DGX unit * 9 nodes per pod) + networking
      const dgxUnitsH200 = podsH200 * 9; // 9 DGX nodes per pod
      const networkingCostH200 = 547900000; // Static $547.9M for networking
      const hardwareCostH200 = (dgxUnitsH200 * h200PricePerUnit) + networkingCostH200;

      // Electricity cost over 3 years (using slider rates)
      const utilizationRate = utilization / 100;
      const electricityCostChina = sizeMW * 1000 * utilizationRate * electricityRateChina * 8760 * 3;
      const electricityCostUS = sizeMW * 1000 * utilizationRate * electricityRateUS * 8760 * 3;

      // Personnel costs over 3 years (500 employees)
      const personnelCostUS = 500 * 122672 * 3;  // $122,672 avg salary
      const personnelCostChina = 500 * 21925 * 3;  // $21,925 avg salary

      // Total costs (mid-point estimates)
      const totalCostUS = constructionTotalUS + hardwareCostUS + electricityCostUS + personnelCostUS;
      const totalCostChina = constructionTotalChina + hardwareCostChina + electricityCostChina + personnelCostChina;
      const totalCostH200 = constructionTotalChina + hardwareCostH200 + electricityCostChina + personnelCostChina;

      // Calculate error ranges (combined via quadrature)
      // US GB200 errors (using price range)
      const gb200HwLow = racksUS * gb200PriceLow;
      const gb200HwHigh = racksUS * gb200PriceHigh;
      const errorGB200HwLower = hardwareCostUS - gb200HwLow;
      const errorGB200HwUpper = gb200HwHigh - hardwareCostUS;
      // Electricity error based on rate range
      const elecCostUSLow = sizeMW * 1000 * utilizationRate * electricityRateUSLow * 8760 * 3;
      const elecCostUSHigh = sizeMW * 1000 * utilizationRate * electricityRateUSHigh * 8760 * 3;
      const errorElecUSLower = electricityCostUS - elecCostUSLow;
      const errorElecUSUpper = elecCostUSHigh - electricityCostUS;
      const errorConstructionUS = (constructionCostUS === 10) ? 0.8 * sizeMW * 1000000 :
        Math.abs(constructionCostUS - 10) * sizeMW * 1000000;
      const totalErrorUSLower = Math.sqrt(errorConstructionUS**2 + errorGB200HwLower**2 + errorElecUSLower**2);
      const totalErrorUSUpper = Math.sqrt(errorConstructionUS**2 + errorGB200HwUpper**2 + errorElecUSUpper**2);

      // China CM384 errors (using price range)
      const cm384HwLow = racksChina * cm384PriceLow;
      const cm384HwHigh = racksChina * cm384PriceHigh;
      const errorCM384HwLower = hardwareCostChina - cm384HwLow;
      const errorCM384HwUpper = cm384HwHigh - hardwareCostChina;
      // Electricity error based on rate range
      const elecCostChinaLow = sizeMW * 1000 * utilizationRate * electricityRateChinaLow * 8760 * 3;
      const elecCostChinaHigh = sizeMW * 1000 * utilizationRate * electricityRateChinaHigh * 8760 * 3;
      const errorElecChinaLower = electricityCostChina - elecCostChinaLow;
      const errorElecChinaUpper = elecCostChinaHigh - electricityCostChina;
      const errorConstructionChina = (constructionCostChina === 6) ? 0.2 * sizeMW * 1000000 :
        Math.abs(constructionCostChina - 6) * sizeMW * 1000000;
      const totalErrorChinaLower = Math.sqrt(errorConstructionChina**2 + errorCM384HwLower**2 + errorElecChinaLower**2);
      const totalErrorChinaUpper = Math.sqrt(errorConstructionChina**2 + errorCM384HwUpper**2 + errorElecChinaUpper**2);

      // China H200 errors (using price range)
      const h200HwLow = (dgxUnitsH200 * h200PriceLow) + networkingCostH200;
      const h200HwHigh = (dgxUnitsH200 * h200PriceHigh) + networkingCostH200;
      const errorH200HwLower = hardwareCostH200 - h200HwLow;
      const errorH200HwUpper = h200HwHigh - hardwareCostH200;
      const totalErrorH200Lower = Math.sqrt(errorConstructionChina**2 + errorH200HwLower**2 + errorElecChinaLower**2);
      const totalErrorH200Upper = Math.sqrt(errorConstructionChina**2 + errorH200HwUpper**2 + errorElecChinaUpper**2);

      // Sustainable performance calculations (SPFLOPS)
      const spflopsUS = racksUS * calcSPFLOPS(hardware.gb200);
      const spflopsChina = racksChina * calcSPFLOPS(hardware.cm384);
      const spflopsH200 = podsH200 * calcSPFLOPS(hardware.h200pod);

      // Performance per dollar (SGFLOPS/$)
      const sgflopsPerDollarUS = (spflopsUS * 1000000) / totalCostUS;
      const sgflopsPerDollarChina = (spflopsChina * 1000000) / totalCostChina;
      const sgflopsPerDollarH200 = (spflopsH200 * 1000000) / totalCostH200;

      // Efficiency ranges (low cost = high efficiency, high cost = low efficiency)
      const sgflopsPerDollarUSLow = (spflopsUS * 1000000) / (totalCostUS + totalErrorUSUpper);
      const sgflopsPerDollarUSHigh = (spflopsUS * 1000000) / (totalCostUS - totalErrorUSLower);
      const sgflopsPerDollarChinaLow = (spflopsChina * 1000000) / (totalCostChina + totalErrorChinaUpper);
      const sgflopsPerDollarChinaHigh = (spflopsChina * 1000000) / (totalCostChina - totalErrorChinaLower);
      const sgflopsPerDollarH200Low = (spflopsH200 * 1000000) / (totalCostH200 + totalErrorH200Upper);
      const sgflopsPerDollarH200High = (spflopsH200 * 1000000) / (totalCostH200 - totalErrorH200Lower);

      const formatCurrency = (value) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        }).format(value);
      };

      const formatNumber = (value) => {
        return new Intl.NumberFormat('en-US', {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2,
        }).format(value);
      };

      const SliderControl = ({ label, value, onChange, min, max, step, unit, icon, suffix = '', benchmarkValue = null, benchmarkLabel = '' }) => (
        <div className="mb-6">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              {icon && <span className="text-gray-600">{icon}</span>}
              <label className="text-sm font-medium text-gray-700">{label}</label>
            </div>
            <span className="text-sm font-bold text-gray-900">{unit}{formatNumber(value)}{suffix}</span>
          </div>
          <div className="relative">
            <input
              type="range"
              min={min}
              max={max}
              step={step}
              value={value}
              onChange={(e) => onChange(parseFloat(e.target.value))}
              className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
            />
            {benchmarkValue !== null && (
              <div
                className="absolute top-0 w-1 h-2 bg-green-600 pointer-events-none"
                style={{ left: `${((benchmarkValue - min) / (max - min)) * 100}%` }}
                title={benchmarkLabel}
              />
            )}
          </div>
          {benchmarkValue !== null && (
            <div className="text-xs text-green-700 mt-1 flex items-center gap-1">
              <span className="inline-block w-3 h-3 bg-green-600 rounded-sm"></span>
              {benchmarkLabel}
            </div>
          )}
        </div>
      );

      const PrecisionSelector = ({ label, value, onChange, options, color }) => (
        <div className="mb-4">
          <label className="text-xs font-medium text-gray-600 block mb-2">{label}</label>
          <div className="flex gap-1">
            {options.map((opt) => (
              <button
                key={opt}
                onClick={() => onChange(opt)}
                className={`px-3 py-1 text-xs font-semibold rounded transition-all ${
                  value === opt
                    ? `${color} text-white shadow-md`
                    : 'bg-gray-200 text-gray-600 hover:bg-gray-300'
                }`}
              >
                {opt}
              </button>
            ))}
          </div>
        </div>
      );

      const ResultCard = ({ title, construction, hardware, electricity, personnel, total, errorLower, errorUpper, units, unitLabel, spflops, sgflopsPerDollar, sgflopsLow, sgflopsHigh, color, flag, spflopsPerUnit, crossoverAI, computeBound, quantization, peakPFLOPS }) => (
        <div className={`p-6 rounded-lg ${color}`}>
          <h3 className="text-2xl font-bold mb-2">{flag} {title}</h3>
          <div className="text-sm font-semibold text-gray-600 mb-4">Precision: {quantization}</div>

          <div className="mb-4">
            <h4 className="text-sm font-semibold text-gray-600 mb-2">COST BREAKDOWN (3 Years)</h4>
            <div className="space-y-2 text-sm">
              <div className="flex justify-between">
                <span>Construction:</span>
                <span className="font-semibold">{formatCurrency(construction)}</span>
              </div>
              <div className="flex justify-between">
                <span>Hardware ({formatNumber(units)} {unitLabel}):</span>
                <span className="font-semibold">{formatCurrency(hardware)}</span>
              </div>
              <div className="flex justify-between">
                <span>Electricity:</span>
                <span className="font-semibold">{formatCurrency(electricity)}</span>
              </div>
              <div className="flex justify-between">
                <span>Personnel (500 staff):</span>
                <span className="font-semibold">{formatCurrency(personnel)}</span>
              </div>
            </div>
          </div>

          <div className="pt-4 border-t-2 border-gray-300 mb-4">
            <div className="flex justify-between items-center">
              <span className="text-lg font-bold">Total Cost:</span>
              <span className="text-2xl font-bold">{formatCurrency(total)}</span>
            </div>
            <div className="text-xs text-gray-600 mt-1 text-center">
              Range: {formatCurrency(total - errorLower)} – {formatCurrency(total + errorUpper)}
            </div>
            <div className="text-xs text-gray-500 text-center">
              (±{formatCurrency((errorLower + errorUpper) / 2)} uncertainty)
            </div>
          </div>

          <div className="pt-4 border-t-2 border-gray-300 bg-white bg-opacity-40 p-4 rounded">
            <h4 className="text-sm font-semibold text-gray-600 mb-3">SUSTAINABLE PERFORMANCE (AI={arithmeticIntensity})</h4>

            <div className={`mb-3 px-3 py-2 rounded-lg text-center ${computeBound ? 'bg-orange-100 border border-orange-300' : 'bg-blue-100 border border-blue-300'}`}>
              <span className={`text-sm font-semibold ${computeBound ? 'text-orange-700' : 'text-blue-700'}`}>
                {computeBound ? '⚡ Compute-Bound' : '💾 Memory-Bound'}
              </span>
              <div className="text-xs text-gray-600 mt-1">
                Crossover at AI = {crossoverAI}
              </div>
            </div>

            <div className="space-y-3">
              <div>
                <div className="text-xs text-gray-600">Peak PFLOPS ({quantization})</div>
                <div className="text-lg font-bold text-purple-700">{formatNumber(peakPFLOPS)} PFLOPS</div>
              </div>
              <div>
                <div className="text-xs text-gray-600">Total Sustainable PFLOPS</div>
                <div className="text-2xl font-bold text-indigo-700">{formatNumber(spflops)} SPFLOPS</div>
                <div className="text-xs text-gray-500">({formatNumber(spflopsPerUnit)} SPFLOPS per unit)</div>
              </div>
              <div>
                <div className="text-xs text-gray-600">Sustainable Efficiency</div>
                <div className="text-2xl font-bold text-green-700">{formatNumber(sgflopsPerDollar)} SGFLOPS/$</div>
                <div className="text-xs text-gray-500">Range: {formatNumber(sgflopsLow)} – {formatNumber(sgflopsHigh)}</div>
              </div>
            </div>
          </div>
        </div>
      );

      // Find the best performer
      const maxSGFLOPS = Math.max(sgflopsPerDollarUS, sgflopsPerDollarChina, sgflopsPerDollarH200);
      const efficiencyWinner = sgflopsPerDollarUS === maxSGFLOPS ? 'U.S.' :
                               sgflopsPerDollarChina === maxSGFLOPS ? 'China (CM384)' : 'China (H200)';

      const maxSPFLOPS = Math.max(spflopsUS, spflopsChina, spflopsH200);
      const performanceWinner = spflopsUS === maxSPFLOPS ? 'U.S.' :
                                spflopsChina === maxSPFLOPS ? 'China (CM384)' : 'China (H200)';

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-8">
          <div className="max-w-7xl mx-auto">
            <div className="text-center mb-8">
              <h1 className="text-5xl font-bold text-white mb-3">Data Center Performance & Cost Analysis</h1>
              <p className="text-gray-300 text-lg">3-Year Total Cost of Ownership: U.S. vs China (CM384) vs China (H200)</p>
              <p className="text-gray-400 text-sm mt-2">Using Sustainable PFLOPS (at AI={arithmeticIntensity}) with Precision Options</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
              {/* Controls */}
              <div className="lg:col-span-1 bg-white rounded-lg shadow-2xl p-6">
                <h2 className="text-2xl font-bold mb-6 text-gray-800">Configuration</h2>

                <div className="mb-6 bg-indigo-50 p-4 rounded-lg">
                  <h3 className="text-lg font-semibold mb-4 text-indigo-900">Facility Size</h3>
                  <SliderControl
                    label="Power Capacity"
                    value={sizeMW}
                    onChange={setSizeMW}
                    min={100}
                    max={1000}
                    step={10}
                    unit=""
                    suffix=" MW"
                    icon="⚡"
                    benchmarkValue={400}
                    benchmarkLabel="Benchmark: 400 MW"
                  />
                </div>

                <div className="mb-6 bg-purple-50 p-4 rounded-lg">
                  <h3 className="text-lg font-semibold mb-4 text-purple-900">Shared Parameters</h3>
                  <SliderControl
                    label="PUE"
                    value={pue}
                    onChange={setPue}
                    min={1.04}
                    max={1.20}
                    step={0.01}
                    unit=""
                    suffix=""
                    icon="⚡"
                    benchmarkValue={1.11}
                    benchmarkLabel="Benchmark: 1.11"
                  />
                  <SliderControl
                    label="Utilization Rate"
                    value={utilization}
                    onChange={setUtilization}
                    min={40}
                    max={80}
                    step={5}
                    unit=""
                    suffix="%"
                    icon="💻"
                    benchmarkValue={60}
                    benchmarkLabel="Benchmark: 60%"
                  />
                  <div className="mb-6">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-gray-600">🧮</span>
                        <label className="text-sm font-medium text-gray-700">Arithmetic Intensity</label>
                      </div>
                      <span className="text-sm font-bold text-gray-900">{formatNumber(arithmeticIntensity)} FLOPs/byte</span>
                    </div>
                    <div className="relative">
                      <input
                        type="range"
                        min={10}
                        max={500}
                        step={10}
                        value={arithmeticIntensity}
                        onChange={(e) => setArithmeticIntensity(parseFloat(e.target.value))}
                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                      />
                      {/* Crossover markers */}
                      <div
                        className="absolute top-0 w-1 h-2 bg-blue-600 pointer-events-none"
                        style={{ left: `${Math.min(100, Math.max(0, ((calcCrossoverAI(hardware.gb200) - 10) / (500 - 10)) * 100))}%` }}
                        title={`GB200: AI=${calcCrossoverAI(hardware.gb200)}`}
                      />
                      <div
                        className="absolute top-0 w-1 h-2 bg-red-600 pointer-events-none"
                        style={{ left: `${Math.min(100, Math.max(0, ((calcCrossoverAI(hardware.cm384) - 10) / (500 - 10)) * 100))}%` }}
                        title={`CM384: AI=${calcCrossoverAI(hardware.cm384)}`}
                      />
                      <div
                        className="absolute top-0 w-1 h-2 bg-green-600 pointer-events-none"
                        style={{ left: `${Math.min(100, Math.max(0, ((calcCrossoverAI(hardware.h200pod) - 10) / (500 - 10)) * 100))}%` }}
                        title={`H200: AI=${calcCrossoverAI(hardware.h200pod)}`}
                      />
                    </div>
                    <div className="text-xs mt-2 space-y-1">
                      <div className="flex items-center gap-1">
                        <span className="inline-block w-3 h-3 bg-red-600 rounded-sm"></span>
                        <span className="text-gray-600">CM384: {calcCrossoverAI(hardware.cm384)}</span>
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="inline-block w-3 h-3 bg-blue-600 rounded-sm"></span>
                        <span className="text-gray-600">GB200: {calcCrossoverAI(hardware.gb200)}</span>
                      </div>
                      <div className="flex items-center gap-1">
                        <span className="inline-block w-3 h-3 bg-green-600 rounded-sm"></span>
                        <span className="text-gray-600">H200: {calcCrossoverAI(hardware.h200pod)}</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mb-6 bg-yellow-50 p-4 rounded-lg border-2 border-yellow-300">
                  <h3 className="text-lg font-semibold mb-4 text-yellow-900">Precision</h3>
                  <PrecisionSelector
                    label="GB200 NVL72 (U.S.)"
                    value={quantizationGB200}
                    onChange={setQuantizationGB200}
                    options={baseHardware.gb200.supportedQuant}
                    color="bg-blue-600"
                  />
                  <PrecisionSelector
                    label="CloudMatrix 384 (China)"
                    value={quantizationCM384}
                    onChange={setQuantizationCM384}
                    options={baseHardware.cm384.supportedQuant}
                    color="bg-red-600"
                  />
                  <PrecisionSelector
                    label="H200 Pod (China)"
                    value={quantizationH200}
                    onChange={setQuantizationH200}
                    options={baseHardware.h200pod.supportedQuant}
                    color="bg-green-600"
                  />
                  <div className="text-xs text-gray-500 mt-2">
                    <p>FP4 only available on GB200 (Blackwell architecture)</p>
                  </div>
                </div>

                <div className="mb-6 bg-blue-50 p-4 rounded-lg">
                  <h3 className="text-sm font-semibold mb-2 text-blue-900">U.S. Construction</h3>
                  <SliderControl
                    label=""
                    value={constructionCostUS}
                    onChange={setConstructionCostUS}
                    min={8}
                    max={12}
                    step={0.5}
                    unit="$"
                    suffix="M/MW"
                    benchmarkValue={10}
                    benchmarkLabel="$10M/MW"
                  />
                </div>

                <div className="bg-red-50 p-4 rounded-lg">
                  <h3 className="text-sm font-semibold mb-2 text-red-900">China Construction</h3>
                  <SliderControl
                    label=""
                    value={constructionCostChina}
                    onChange={setConstructionCostChina}
                    min={5.5}
                    max={6.5}
                    step={0.1}
                    unit="$"
                    suffix="M/MW"
                    benchmarkValue={6}
                    benchmarkLabel="$6M/MW"
                  />
                </div>

                <div className="mt-6 bg-orange-50 p-4 rounded-lg border-2 border-orange-300">
                  <h3 className="text-lg font-semibold mb-4 text-orange-900">📊 Uncertainty / Margin of Error</h3>

                  <div className="mb-4">
                    <h4 className="text-xs font-semibold text-gray-600 mb-2">Hardware Price per Unit</h4>

                    <div className="mb-4">
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="text-gray-600">🔵</span>
                          <label className="text-sm font-medium text-gray-700">GB200 NVL72</label>
                        </div>
                        <span className="text-sm font-bold text-gray-900">${formatNumber(gb200PricePerUnit)}/rack</span>
                      </div>
                      <input
                        type="range"
                        min={2340000}
                        max={2860000}
                        step={10000}
                        value={gb200PricePerUnit}
                        onChange={(e) => setGb200PricePerUnit(parseFloat(e.target.value))}
                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                      />
                      <div className="text-xs text-gray-500 mt-1 flex justify-between">
                        <span>$2.34M (low)</span>
                        <span>$2.86M (high)</span>
                      </div>
                    </div>

                    <div className="mb-4">
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="text-gray-600">🔴</span>
                          <label className="text-sm font-medium text-gray-700">CM384</label>
                        </div>
                        <span className="text-sm font-bold text-gray-900">${formatNumber(cm384PricePerUnit)}/rack</span>
                      </div>
                      <input
                        type="range"
                        min={7200000}
                        max={8800000}
                        step={100000}
                        value={cm384PricePerUnit}
                        onChange={(e) => setCm384PricePerUnit(parseFloat(e.target.value))}
                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                      />
                      <div className="text-xs text-gray-500 mt-1 flex justify-between">
                        <span>$7.2M (low)</span>
                        <span>$8.8M (high)</span>
                      </div>
                    </div>

                    <div className="mb-4">
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="text-gray-600">🟢</span>
                          <label className="text-sm font-medium text-gray-700">H200 DGX</label>
                        </div>
                        <span className="text-sm font-bold text-gray-900">${formatNumber(h200PricePerUnit)}/unit</span>
                      </div>
                      <input
                        type="range"
                        min={322500}
                        max={500000}
                        step={5000}
                        value={h200PricePerUnit}
                        onChange={(e) => setH200PricePerUnit(parseFloat(e.target.value))}
                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                      />
                      <div className="text-xs text-gray-500 mt-1 flex justify-between">
                        <span>$322,500 (low)</span>
                        <span>$500,000 (high)</span>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-orange-200">
                    <h4 className="text-xs font-semibold text-gray-600 mb-2">Electricity Rate ($/kWh)</h4>

                    <div className="mb-4">
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="text-gray-600">🔵</span>
                          <label className="text-sm font-medium text-gray-700">U.S. Rate</label>
                        </div>
                        <span className="text-sm font-bold text-gray-900">${electricityRateUS.toFixed(4)}/kWh</span>
                      </div>
                      <input
                        type="range"
                        min={0.0588}
                        max={0.1903}
                        step={0.001}
                        value={electricityRateUS}
                        onChange={(e) => setElectricityRateUS(parseFloat(e.target.value))}
                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                      />
                      <div className="text-xs text-gray-500 mt-1 flex justify-between">
                        <span>$0.059 (Louisiana)</span>
                        <span>$0.190 (Massachusetts)</span>
                      </div>
                    </div>

                    <div className="mb-4">
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="text-gray-600">🔴</span>
                          <label className="text-sm font-medium text-gray-700">China Rate</label>
                        </div>
                        <span className="text-sm font-bold text-gray-900">${electricityRateChina.toFixed(4)}/kWh</span>
                      </div>
                      <input
                        type="range"
                        min={0.045}
                        max={0.11}
                        step={0.001}
                        value={electricityRateChina}
                        onChange={(e) => setElectricityRateChina(parseFloat(e.target.value))}
                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                      />
                      <div className="text-xs text-gray-500 mt-1 flex justify-between">
                        <span>$0.045 (low)</span>
                        <span>$0.110 (high)</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Results */}
              <div className="lg:col-span-3 space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <ResultCard
                    title="United States"
                    flag="🇺🇸"
                    construction={constructionTotalUS}
                    hardware={hardwareCostUS}
                    electricity={electricityCostUS}
                    personnel={personnelCostUS}
                    total={totalCostUS}
                    errorLower={totalErrorUSLower}
                    errorUpper={totalErrorUSUpper}
                    units={racksUS}
                    unitLabel="GB200 NVL72 racks"
                    spflops={spflopsUS}
                    spflopsPerUnit={calcSPFLOPS(hardware.gb200)}
                    sgflopsPerDollar={sgflopsPerDollarUS}
                    sgflopsLow={sgflopsPerDollarUSLow}
                    sgflopsHigh={sgflopsPerDollarUSHigh}
                    crossoverAI={calcCrossoverAI(hardware.gb200)}
                    computeBound={isComputeBound(hardware.gb200)}
                    quantization={quantizationGB200}
                    peakPFLOPS={hardware.gb200.peakPFLOPS}
                    color="bg-gradient-to-br from-blue-100 to-blue-200 border-4 border-blue-400 shadow-xl"
                  />

                  <ResultCard
                    title="China (CM384)"
                    flag="🇨🇳"
                    construction={constructionTotalChina}
                    hardware={hardwareCostChina}
                    electricity={electricityCostChina}
                    personnel={personnelCostChina}
                    total={totalCostChina}
                    errorLower={totalErrorChinaLower}
                    errorUpper={totalErrorChinaUpper}
                    units={racksChina}
                    unitLabel="CloudMatrix 384 racks"
                    spflops={spflopsChina}
                    spflopsPerUnit={calcSPFLOPS(hardware.cm384)}
                    sgflopsPerDollar={sgflopsPerDollarChina}
                    sgflopsLow={sgflopsPerDollarChinaLow}
                    sgflopsHigh={sgflopsPerDollarChinaHigh}
                    crossoverAI={calcCrossoverAI(hardware.cm384)}
                    computeBound={isComputeBound(hardware.cm384)}
                    quantization={quantizationCM384}
                    peakPFLOPS={hardware.cm384.peakPFLOPS}
                    color="bg-gradient-to-br from-red-100 to-red-200 border-4 border-red-400 shadow-xl"
                  />

                  <ResultCard
                    title="China (H200)"
                    flag="🇨🇳"
                    construction={constructionTotalChina}
                    hardware={hardwareCostH200}
                    electricity={electricityCostChina}
                    personnel={personnelCostChina}
                    total={totalCostH200}
                    errorLower={totalErrorH200Lower}
                    errorUpper={totalErrorH200Upper}
                    units={podsH200}
                    unitLabel="DGX H200 pods"
                    spflops={spflopsH200}
                    spflopsPerUnit={calcSPFLOPS(hardware.h200pod)}
                    sgflopsPerDollar={sgflopsPerDollarH200}
                    sgflopsLow={sgflopsPerDollarH200Low}
                    sgflopsHigh={sgflopsPerDollarH200High}
                    crossoverAI={calcCrossoverAI(hardware.h200pod)}
                    computeBound={isComputeBound(hardware.h200pod)}
                    quantization={quantizationH200}
                    peakPFLOPS={hardware.h200pod.peakPFLOPS}
                    color="bg-gradient-to-br from-green-100 to-green-200 border-4 border-green-400 shadow-xl"
                  />
                </div>

                <div className="bg-gradient-to-r from-yellow-200 via-orange-200 to-pink-200 p-6 rounded-lg shadow-2xl border-4 border-yellow-400">
                  <h3 className="text-2xl font-bold mb-6 text-center">Comparative Analysis</h3>

                  <div className="grid grid-cols-3 gap-4">
                    <div className="bg-white bg-opacity-70 p-4 rounded-lg text-center">
                      <h4 className="text-sm font-semibold text-gray-600 mb-2">Performance Winner</h4>
                      <p className="text-2xl font-bold text-indigo-800">{performanceWinner}</p>
                      <p className="text-lg font-semibold text-indigo-600">{formatNumber(maxSPFLOPS)} SPFLOPS</p>
                    </div>

                    <div className="bg-white bg-opacity-70 p-4 rounded-lg text-center">
                      <h4 className="text-sm font-semibold text-gray-600 mb-2">Efficiency Winner</h4>
                      <p className="text-2xl font-bold text-green-800">{efficiencyWinner}</p>
                      <p className="text-lg font-semibold text-green-600">{formatNumber(maxSGFLOPS)} SGFLOPS/$</p>
                    </div>

                    <div className="bg-white bg-opacity-70 p-4 rounded-lg text-center">
                      <h4 className="text-sm font-semibold text-gray-600 mb-2">Lowest Cost</h4>
                      <p className="text-2xl font-bold text-purple-800">
                        {totalCostChina <= totalCostUS && totalCostChina <= totalCostH200 ? 'China (CM384)' :
                         totalCostH200 <= totalCostUS ? 'China (H200)' : 'U.S.'}
                      </p>
                      <p className="text-lg font-semibold text-purple-600">
                        {formatCurrency(Math.min(totalCostUS, totalCostChina, totalCostH200))}
                      </p>
                    </div>
                  </div>

                  <div className="mt-4 bg-white bg-opacity-50 p-4 rounded-lg">
                    <h4 className="text-sm font-semibold text-gray-600 mb-2 text-center">Efficiency Comparison (vs U.S.)</h4>
                    <div className="grid grid-cols-2 gap-4 text-center">
                      <div>
                        <span className="text-sm text-gray-600">China (CM384):</span>
                        <span className={`ml-2 font-bold ${sgflopsPerDollarChina >= sgflopsPerDollarUS ? 'text-green-600' : 'text-red-600'}`}>
                          {sgflopsPerDollarChina >= sgflopsPerDollarUS ? '+' : ''}{(((sgflopsPerDollarChina / sgflopsPerDollarUS) - 1) * 100).toFixed(1)}%
                        </span>
                      </div>
                      <div>
                        <span className="text-sm text-gray-600">China (H200):</span>
                        <span className={`ml-2 font-bold ${sgflopsPerDollarH200 >= sgflopsPerDollarUS ? 'text-green-600' : 'text-red-600'}`}>
                          {sgflopsPerDollarH200 >= sgflopsPerDollarUS ? '+' : ''}{(((sgflopsPerDollarH200 / sgflopsPerDollarUS) - 1) * 100).toFixed(1)}%
                        </span>
                      </div>
                    </div>
                  </div>

                  <div className="mt-4 bg-white bg-opacity-50 p-4 rounded-lg">
                    <h4 className="text-sm font-semibold text-gray-600 mb-2 text-center">Precision Settings</h4>
                    <div className="grid grid-cols-3 gap-4 text-center text-sm">
                      <div>
                        <span className="text-blue-700 font-semibold">U.S.: {quantizationGB200}</span>
                      </div>
                      <div>
                        <span className="text-red-700 font-semibold">CM384: {quantizationCM384}</span>
                      </div>
                      <div>
                        <span className="text-green-700 font-semibold">H200: {quantizationH200}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<DataCenterCompare />, document.getElementById('root'));
  </script>
</body>
</html>
